site_name: routerscope
site_description: Instant search, time-travel diff and a Winbox-like browser for multi-vendor router configs and CLI sessions.
repo_url: https://github.com/dalcorsogabriel/routerscope
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Storage: storage.md
  - Importers:
      - importers.md
      - importers-git.md
  - Roadmap: roadmap.md
  - Guides:
      - guides/add-a-vendor.md
  - Decisions:
      - decisions/0001-record-architecture-decisions.md
      - decisions/0002-scaffolding-choices.md
      - decisions/0003-config-tree-parser.md
  - Plans:
      - plans/v0.1.md
  - Project brief: PROJECT_BRIEF.md
not_in_nav: |
  launch/*
