[project]
name = "netprompt"
version = "0.0.1"
description = "Detect router prompts, vendor and CLI mode, and segment terminal sessions into commands and outputs."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "routerscope contributors" }]
keywords = ["network", "cli", "prompt", "terminal", "session", "parser"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dalcorsogabriel/routerscope"
Issues = "https://github.com/dalcorsogabriel/routerscope/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netprompt"]
