!
hostname OCN1
!
ip vrf CUST-B
 rd 64496:200
 route-target both 64496:200
!
interface lo
 ip address 192.0.2.10/32
!
interface xe1
 description core link
 mtu 9216
 ip address 198.51.100.9/31
 ipv6 address 2001:db8:2::1/64
!
interface xe2
 ip vrf forwarding CUST-B
 ip address 203.0.113.9/30
 shutdown
!
router bgp 64496
 neighbor 198.51.100.8 remote-as 64496
 neighbor 198.51.100.8 description core
 neighbor 198.51.100.8 route-map CORE-IN in
 neighbor 198.51.100.8 route-map CORE-OUT out
 address-family ipv4 unicast
  neighbor 198.51.100.8 activate
 exit-address-family
 address-family ipv4 vrf CUST-B
  neighbor 203.0.113.10 remote-as 65536
 exit-address-family
!
ip route 192.0.2.128/25 198.51.100.8
ip route vrf CUST-B 198.51.100.128/25 203.0.113.10 20
!
ip prefix-list PL-CORE seq 5 permit 192.0.2.0/24 le 32
ipv6 prefix-list PL6-CORE seq 5 permit 2001:db8::/32
!
vlan database
 vlan 100 name OFFICE state enable
 vlan 200 bridge 1 state enable
!
end
