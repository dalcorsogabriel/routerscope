!
! Synthetic IOS-XE configuration (documentation addresses only)
version 17.3
service timestamps debug datetime msec
!
hostname PE1
!
banner motd ^C
Authorized access only
Do not disconnect
^C
!
ip vrf CUST-A
 rd 64496:100
 route-target export 64496:100
 route-target import 64496:100
 description Customer A
!
vrf definition MGMT
 rd 64496:999
 !
 address-family ipv4
  route-target export 64496:999
 exit-address-family
!
vlan 100
 name SERVERS
!
vlan 200
 name VOICE
!
interface Loopback0
 description router-id
 ip address 192.0.2.1 255.255.255.255
 ipv6 address 2001:db8::1/128
!
interface GigabitEthernet0/0/0
 description uplink to P1
 mtu 9000
 ip address 198.51.100.1 255.255.255.252
 ip address 198.51.100.5 255.255.255.252 secondary
 ipv6 address 2001:db8:1::1/64
 no shutdown
!
interface GigabitEthernet0/0/1.100
 description CUST-A access
 encapsulation dot1Q 100
 ip vrf forwarding CUST-A
 ip address 203.0.113.1 255.255.255.0
!
interface GigabitEthernet0/0/2
 shutdown
!
crypto pki certificate chain TP-self-signed-1
 certificate self-signed 01
  30820123 30820100 A0030201 02020101
  0D06092A 864886F7 0D010105 05003000
  quit
!
router bgp 64496
 bgp router-id 192.0.2.1
 neighbor RR peer-group
 neighbor RR remote-as 64496
 neighbor RR route-map RR-IN in
 neighbor 192.0.2.2 peer-group RR
 neighbor 198.51.100.2 remote-as 64500
 neighbor 198.51.100.2 description transit A
 neighbor 198.51.100.2 local-as 64501
 !
 address-family ipv4
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 route-map TRANSIT-IN in
  neighbor 198.51.100.2 route-map TRANSIT-OUT out
  neighbor 192.0.2.2 activate
 exit-address-family
 !
 address-family ipv4 vrf CUST-A
  neighbor 203.0.113.2 remote-as 64502
  neighbor 203.0.113.2 activate
 exit-address-family
!
ip route 0.0.0.0 0.0.0.0 198.51.100.2 200 tag 10 name default-transit
ip route vrf CUST-A 192.0.2.128 255.255.255.128 203.0.113.2
ip route 192.0.2.64 255.255.255.192 Null0
ipv6 route 2001:db8:ffff::/48 2001:db8:1::2
!
ip prefix-list CUST-IN seq 5 permit 203.0.113.0/24 le 28
ip prefix-list CUST-IN seq 10 deny 0.0.0.0/0 le 7
ip prefix-list CUST-IN description not parsed
ipv6 prefix-list V6-IN seq 5 permit 2001:db8::/32 ge 48 le 64
!
line vty 0 4
 password 7 <redacted>
!
end
