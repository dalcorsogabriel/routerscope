#
 sysname VRP1
#
vlan batch 10 20 to 22
#
vlan 10
 name USERS
#
ip vpn-instance CUST-D
 description Customer D
 ipv4-family
  route-distinguisher 64496:400
  vpn-target 64496:400 export-extcommunity
  vpn-target 64496:400 64496:401 import-extcommunity
#
interface GigabitEthernet0/0/1
 description uplink
 undo shutdown
 mtu 1600
 ip address 198.51.100.17 255.255.255.252
 ip address 198.51.100.21 255.255.255.252 sub
 ipv6 enable
 ipv6 address 2001:db8:4::1/64
#
interface GigabitEthernet0/0/2.400
 ip binding vpn-instance CUST-D
 ip address 203.0.113.17 255.255.255.252
#
interface LoopBack0
 ip address 192.0.2.30 255.255.255.255
#
interface GigabitEthernet0/0/3
 shutdown
#
bgp 64496
 router-id 192.0.2.30
 group IBGP internal
 peer IBGP as-number 64496
 peer 192.0.2.1 group IBGP
 peer 198.51.100.18 as-number 64504
 peer 198.51.100.18 description transit
 #
 ipv4-family unicast
  peer 198.51.100.18 enable
  peer 198.51.100.18 route-policy TR-IN import
  peer 198.51.100.18 route-policy TR-OUT export
  peer 192.0.2.1 enable
 #
 ipv4-family vpn-instance CUST-D
  peer 203.0.113.18 as-number 65540
  peer 203.0.113.18 route-policy CUST-IN import
#
ip route-static 0.0.0.0 0.0.0.0 198.51.100.18 preference 40 tag 3
ip route-static vpn-instance CUST-D 192.0.2.160 255.255.255.224 203.0.113.18 description cust-lan
ip route-static 192.0.2.192 26 NULL0
ipv6 route-static 2001:db8:fff0:: 44 2001:db8:4::2
#
ip ip-prefix PL-CUST index 10 permit 203.0.113.0 24 greater-equal 25 less-equal 28
ip ip-prefix PL-CUST index 20 deny 0.0.0.0 0
ip ipv6-prefix PL6 index 10 permit 2001:db8:: 32
#
return
