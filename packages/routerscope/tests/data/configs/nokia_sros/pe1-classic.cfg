# TiMOS-B-22.10.R1 both/x86_64 Nokia 7750 SR (synthetic)
echo "System Configuration"
#--------------------------------------------------
    system
        name "SR1"
    exit
#--------------------------------------------------
echo "Port Configuration"
#--------------------------------------------------
    port 1/1/1
        description "to-PE2"
        ethernet
            mode network
        exit
        no shutdown
    exit
    port 1/1/2
        shutdown
    exit
#--------------------------------------------------
echo "Router (Network Side) Configuration"
#--------------------------------------------------
    router Base
        autonomous-system 64496
        interface "system"
            address 192.0.2.50/32
            no shutdown
        exit
        interface "to-PE2"
            description "core link"
            address 198.51.100.29/30
            ipv6
                address 2001:db8:6::1/64
            exit
            port 1/1/1
            ip-mtu 9000
            no shutdown
        exit
        static-route-entry 0.0.0.0/0
            next-hop 198.51.100.30
                preference 20
                no shutdown
            exit
        exit
        static-route-entry 192.0.2.192/26
            black-hole
                no shutdown
            exit
        exit
        bgp
            group "IBGP"
                family ipv4 vpn-ipv4
                peer-as 64496
                import "RR-IN" "LEAK-IN"
                export "NHS"
                neighbor 192.0.2.1
                    description "rr1"
                exit
            exit
            group "TRANSIT"
                peer-as 64550
                neighbor 198.51.100.30
                    local-as 64560
                    import "TRANSIT-IN"
                exit
            exit
            no shutdown
        exit
    exit
#--------------------------------------------------
echo "Service Configuration"
#--------------------------------------------------
    service
        vprn 600 name "CUST-F" customer 1 create
            route-distinguisher 64496:600
            vrf-target export target:64496:600
            interface "to-cust" create
                address 203.0.113.29/30
                shutdown
            exit
            bgp
                group "cust"
                    peer-as 65548
                    neighbor 203.0.113.30
                    exit
                exit
            exit
        exit
    exit
#--------------------------------------------------
echo "Policy Configuration"
#--------------------------------------------------
    policy-options
        begin
        prefix-list "CUST-F"
            prefix 203.0.113.0/24 exact
            prefix 198.51.100.0/24 longer
            prefix 192.0.2.0/24 prefix-length-range 25-28
            prefix 2001:db8::/32 through 48
        exit
        commit
    exit
exit all
