/interface bridge
add name=bridge1 vlan-filtering=yes
/interface ethernet
set [ find default-name=ether1 ] comment="uplink \"main\"" mtu=1500
set [ find default-name=ether2 ] disabled=yes name=ether2-spare
set [ find default-name=ether3 ] name=ether3-cust
/interface vlan
add comment="customer H" interface=ether3-cust name=vlan700 vlan-id=700
/interface bridge vlan
add bridge=bridge1 tagged=ether1 untagged=ether3-cust vlan-ids=100,200-201
/ip vrf
