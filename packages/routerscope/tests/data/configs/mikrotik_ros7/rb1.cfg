/routing bgp connection
add as=64496 input.filter=TRANSIT-IN local.role=ebgp name=transit \
    output.filter-chain=TRANSIT-OUT remote.address=198.51.100.38 remote.as=64510 \
    comment="transit provider"
add as=64496 local.role=ebgp name=cust remote.address=203.0.113.38/32 remote.as=65551 vrf=CUST-H
add as=64496 local.role=ibgp name=bad remote.address=not-an-ip remote.as=64496
/ip route
add dst-address=0.0.0.0/0 gateway=198.51.100.38
add comment=blackhole dst-address=192.0.2.240/28 blackhole
add distance=5 dst-address=192.0.2.0/26 gateway=ether1
add dst-address=198.51.100.200/29 gateway=203.0.113.38 routing-table=CUST-H
/ipv6 route
add dst-address=2001:db8:ffff::/48 gateway=2001:db8:8::2
