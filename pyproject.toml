# uv workspace root (virtual: not a package itself).
# Each publishable package lives in packages/<name>/ with its own pyproject.toml.
[project]
name = "routerscope-workspace"
version = "0.0.0"
requires-python = ">=3.12"
description = "Workspace root for routerscope and its companion libraries"
license = "Apache-2.0"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
netcmd-safety = { workspace = true }
netprompt = { workspace = true }
netaddr-search = { workspace = true }
routerscope = { workspace = true }

[dependency-groups]
dev = [
    "netcmd-safety",
    "netprompt",
    "netaddr-search",
    "routerscope",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "-ra --import-mode=importlib"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
